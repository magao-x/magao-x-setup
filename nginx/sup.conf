upstream sup {
    server 127.0.0.1:9191;
}

upstream sup_stream {
    server 127.0.0.1:9192;
}

# Redirect all HTTP->HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name exao1.magao-x.org;
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name exao1.magao-x.org;

    # Certificate renewal is done as xsup because of reasons
    ssl_certificate     /home/xsup/.lego/certificates/exao1.magao-x.org.crt;
    ssl_certificate_key /home/xsup/.lego/certificates/exao1.magao-x.org.key;

    # Settings every proxied location here shares.
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Image streams: one WebSocket per shmim, and the list of streams.
    # Frames are already compressed and paced by the client's window, so
    # nginx shouldn't buffer them.
    location /ws/viewcam/ {
        proxy_pass http://sup_stream;
        proxy_buffering off;
    }

    # Everything else: the UI, its INDI and log WebSockets, and its HTTP routes.
    location / {
        proxy_pass http://sup;
    }
}
